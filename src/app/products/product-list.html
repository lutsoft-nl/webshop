<h1>Products</h1>

<label class="sort">
  Sort by price
  <select [value]="sortOrder() ?? ''" (change)="onSortChange($any($event.target).value)">
    <option value="">Default</option>
    <option value="asc">Low to high</option>
    <option value="desc">High to low</option>
  </select>
</label>

@if (loading()) {
  <p class="status" role="status">Loading products...</p>
} @else if (error()) {
  <div class="status error" role="alert">
    <p>{{ error() }}</p>
    <button type="button" (click)="load()">Retry</button>
  </div>
} @else {
  <ul class="grid">
    @for (product of products(); track product.id) {
      <li class="card">
        <img [src]="product.thumbnail" [alt]="product.title" width="150" height="150" />
        <h2>{{ product.title }}</h2>
        <p class="price">{{ product.price | currency }}</p>
        <a [routerLink]="['/products', product.id]">Details</a>
      </li>
    }
  </ul>

  <nav class="pagination" aria-label="Pagination">
    <button type="button" (click)="goTo(page() - 1)" [disabled]="page() === 1">Previous</button>
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    <button type="button" (click)="goTo(page() + 1)" [disabled]="page() === totalPages()">Next</button>
  </nav>
}
